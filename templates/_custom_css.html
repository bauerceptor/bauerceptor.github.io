<!--
  _custom_css.html
  Design tokens + serene variable overrides. See DESIGN.md.
-->
<style>
  :root {
    /* fonts */
    --font-serif: "Newsreader", Charter, Georgia, serif;
    --font-sans:  "Inter", system-ui, -apple-system, sans-serif;
    --font-mono:  "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;

    /* serene compatibility */
    --main-font: var(--font-sans);
    --code-font: var(--font-mono);

    /* type scale (1.333 ratio) */
    --text-xs:  0.75rem;
    --text-sm:  0.875rem;
    --text-md:  1rem;
    --text-lg:  1.125rem;
    --text-xl:  1.5rem;
    --text-2xl: 2rem;
    --text-3xl: 2.66rem;
    --text-4xl: 3.55rem;

    /* spacing */
    --sp-1:  4px;
    --sp-2:  8px;
    --sp-3:  12px;
    --sp-4:  16px;
    --sp-5:  24px;
    --sp-6:  32px;
    --sp-7:  48px;
    --sp-8:  64px;
    --sp-9:  96px;
    --sp-10: 128px;

    /* light theme tokens (default) */
    --bg:        oklch(98% 0.008 80);
    --bg-2:      oklch(95% 0.010 80);
    --fg:        oklch(22% 0.015 75);
    --fg-2:      oklch(45% 0.012 75);
    --fg-3:      oklch(65% 0.008 75);
    --rule:      oklch(86% 0.008 80);
    --accent:    oklch(54% 0.18 35);
    --accent-fg: oklch(98% 0.008 80);

    /* serene token bridge */
    --primary-color: var(--accent);
    --bg-color:      var(--bg);
    --text-color:    var(--fg);
  }

  html.dark {
    --bg:        oklch(15% 0.012 270);
    --bg-2:      oklch(19% 0.014 270);
    --fg:        oklch(93% 0.008 70);
    --fg-2:      oklch(70% 0.010 70);
    --fg-3:      oklch(50% 0.012 70);
    --rule:      oklch(26% 0.014 270);
    --accent:    oklch(72% 0.16 40);
    --accent-fg: oklch(15% 0.012 270);
  }

  /* Body / section font assignments. Research pages use serif body; everything else sans. */
  body { font-family: var(--font-sans); color: var(--fg); background: var(--bg); }
  body.section-research,
  body.section-research .prose { font-family: var(--font-serif); }

  /* Numbers should column-align in lists and tables. */
  .post-list, .pub-card, .paper-page__meta, time, .row-meta {
    font-variant-numeric: tabular-nums;
  }

  /* Custom selection — vermilion wash. */
  ::selection {
    background: var(--accent);
    color: var(--accent-fg);
  }

  /* Keyboard shortcut toast + help panel (shortcuts.js). */
  .kb-toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 2000;
    padding: 8px 12px;
    background: var(--fg);
    color: var(--bg);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.04em;
    border-radius: 2px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1),
                transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .kb-toast--in { opacity: 1; transform: translateY(0); }

  .kb-help {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: oklch(15% 0.012 270 / 0.55);
    opacity: 0;
    transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .kb-help--in { opacity: 1; }

  .kb-help pre {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 24px 32px;
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    line-height: 1.7;
    color: var(--fg);
    margin: 0;
  }

  /* Mermaid diagrams (rendered by /js/mermaid-render.js). */
  .mermaid--rendered {
    position: relative;
    margin: var(--sp-5) 0;
    padding: var(--sp-3);
    background: var(--bg-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    min-height: 380px;
  }
  .mermaid--rendered svg { display: block; }
  .mermaid--rendered text { font-family: var(--font-sans) !important; }
  /* svg-pan-zoom control icons (+/-/reset) — quiet, matches site palette */
  .svg-pan-zoom-control { transform: scale(0.85); }
  .svg-pan-zoom-control-background { fill: var(--bg); fill-opacity: 0.9; stroke: var(--rule); }
  .svg-pan-zoom-control-element { fill: var(--fg-2); }

  /* Pre-rendered placeholder: dim until the renderer replaces it. */
  pre.mermaid,
  pre > code.language-mermaid,
  .mermaid:not(.mermaid--rendered) {
    color: var(--fg-3);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
  }

  /* Reduced motion respect. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
