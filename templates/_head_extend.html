<!--
  _head_extend.html — per-page <head> extras.
-->

<!-- Syntax highlight sheets. Zola with style="class" generates one CSS file per theme. -->
<link
  id="hl-light"
  rel="stylesheet"
  href="/github-light.css"
  media="(prefers-color-scheme: light)"
>
<link
  id="hl-dark"
  rel="stylesheet"
  href="/github-dark.css"
  media="(prefers-color-scheme: dark)"
>

<!-- Hamburger menu styles -->
<link rel="stylesheet" href="/css/menu.css">
<link rel="stylesheet" href="/css/copy-btn.css">

<!-- Scripts: deferred so they don't block paint -->
<script defer src="/js/menu.js"></script>
<script defer src="/js/copy-code.js"></script>
<script defer src="/js/shortcuts.js"></script>

<!-- Hello-curious-developer console message -->
<script>
(function () {
  if (typeof console === 'undefined') return;
  var s1 = 'color:#c84a2e;font:600 13px/1.4 ui-monospace,JetBrains Mono,monospace';
  var s2 = 'color:#777;font:400 12px/1.4 ui-monospace,JetBrains Mono,monospace';
  console.log('%cHi.%c If you got this far you might enjoy the source: github.com/bauerceptor — or press ? for keyboard shortcuts.', s1, s2);
})();
</script>

<!-- Section-specific stylesheets -->
{% set path = current_path | default(value="/") %}
{% if path is starting_with("/research") %}
<link rel="stylesheet" href="/css/research.css">
{% elif path is starting_with("/projects") %}
<link rel="stylesheet" href="/css/projects.css">
{% elif path is starting_with("/resume") %}
<link rel="stylesheet" href="/css/resume.css">
{% elif path is starting_with("/notes") %}
<link rel="stylesheet" href="/css/blog-notes.css">
<link rel="stylesheet" href="/css/notes.css">
{% elif path is starting_with("/posts") %}
<link rel="stylesheet" href="/css/blog-notes.css">
{% endif %}
