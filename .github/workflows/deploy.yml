# .github/workflows/deploy.yml
# Builds the Zola site and deploys to GitHub Pages.
# Triggered on every push to main.
#
# Setup steps (one-time):
#   1. Go to repo Settings → Pages → Source: GitHub Actions
#   2. The workflow handles everything else automatically.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # fetches themes/serene at the pinned commit
          fetch-depth: 0

      - name: Debug submodule state (fail loudly)
        run: |
          echo "::error title=submodule_status::$(git submodule status 2>&1 | tr '\n' '|')"
          echo "::error title=ls_themes::$(ls -la themes/ 2>&1 | tr '\n' '|')"
          echo "::error title=ls_themes_serene::$(ls -la themes/serene/ 2>&1 | tr '\n' '|')"
          echo "::error title=gitmodules::$(cat .gitmodules 2>&1 | tr '\n' '|')"
          echo "::error title=git_config_sub::$(git config --list 2>&1 | grep -i submodule | tr '\n' '|')"
          # Don't fail this step; let the real build step decide.
          true

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2       # pin Zola version; update deliberately

      - name: Build site
        run: |
          echo "::error title=pwd::$(pwd)"
          echo "::error title=ls_root::$(ls -la 2>&1 | tr '\n' '|')"
          echo "::error title=ls_themes_serene_pre::$(ls -la themes/serene/ 2>&1 | tr '\n' '|')"
          echo "::error title=stat_theme_toml::$(stat themes/serene/theme.toml 2>&1 | tr '\n' '|')"
          echo "::error title=zola_version::$(zola --version 2>&1)"
          zola build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
