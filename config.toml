base_url = "https://bauerceptor.github.io"
title = "Hassan Aziz"
description = "Machine learning, robotics, security, and networked systems."
default_language = "en"
theme = "serene"
compile_sass = true
build_search_index = true
generate_feeds = false
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags" }, { name = "categories" }]

[markdown]
render_emoji = true
smart_punctuation = true
external_links_target_blank = true
external_links_no_follow = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[search]
include_title = true
include_description = true
include_path = true
include_content = true
truncate_content_length = 100

[extra]
lang = "en"
theme = ""           # follow system; toggle button still works
display_id = false

force_theme = false
back_link_text = "Back"
footer_copyright = "© 2026 Hassan Aziz"
footer_credits = true
not_found_error_text = "404"
not_found_recover_text = "back to home"
reaction_align = "right"
reaction_endpoint = ""

blog_section_path = "/posts"

sections = [
    { name = "Research", path = "/research", is_external = false },
    { name = "Projects", path = "/projects", is_external = false },
    { name = "Writing",  path = "/posts",    is_external = false },
    { name = "Notes",    path = "/notes",    is_external = false },
    { name = "Resume",   path = "/resume",   is_external = false },
]

links = [
    { name = "GitHub",   icon = "github",   url = "https://github.com/bauerceptor" },
    { name = "Email",    icon = "email",    url = "mailto:hassanAZIZ4884@gmail.com" },
    { name = "Scholar",  icon = "scholar",  url = "https://scholar.google.com/citations?user=PLACEHOLDER" },
    { name = "X",        icon = "twitter",  url = "https://x.com/PLACEHOLDER" },
    { name = "LinkedIn", icon = "linkedin", url = "https://linkedin.com/in/PLACEHOLDER" },
]

# Post / page defaults
toc              = true
copy             = true
comment          = false
math             = false
mermaid          = false
reaction         = false
back_to_top      = true
show_reading_time = true

outdate_alert      = false
outdate_alert_days = 365
outdate_alert_text_before = "This post was last updated "
outdate_alert_text_after  = " days ago and may be out of date."

date_format = "%b %-d, %Y"

# Homepage copy
name   = "Hassan Aziz"
id     = "hassan-aziz"
bio    = "Researcher and builder working across machine learning, robotics, security, and networked systems. I prefer hard problems over polished ones."
avatar = "img/avatar.webp"

recent         = true
recent_max     = 5
recent_more_text = "All posts →"

